<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bazaarly Solana Pay Checkout</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Averia+Serif+Libre:wght@300;400;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <main class="checkout">
      <form id="payment-form">
        <section class="cart-editor" aria-label="Order summary">
          <div class="cart-heading">
            <div>
              <p class="eyebrow">BAZAARLY · CHECKOUT</p>
              <h1>Order summary</h1>
              <p id="checkout-event"></p>
            </div>
            <span id="item-count" class="item-count">0 items</span>
          </div>
          <div id="items-container"></div>
          <div class="cart-total">
            <span>Items subtotal <small>USD</small></span>
            <strong id="cart-total">$0.00</strong>
          </div>
        </section>
        <p id="checkout-context" class="checkout-context"></p>
        <button id="pay-button" type="submit" disabled>Continue to payment</button>
      </form>

      <section id="payment-panel" hidden>
        <div class="panel-heading">
          <h2>Scan to pay</h2>
        </div>
        <div id="qr-code" aria-label="Solana Pay QR code"></div>
        <p id="status" class="status">Waiting for payment…</p>
        <p class="payment-note">This demo requests a fixed <strong>0.01 SOL</strong> on Solana Devnet. It is not converted from the USD item total.</p>
      </section>

      <section id="result-panel" hidden>
        <p class="eyebrow">CHECKOUT COMPLETE</p>
        <h2>Payment receipt</h2>
        <dl id="receipt-details" class="details"></dl>
        <p id="accounting-entry" class="accounting-entry"></p>
        <div class="actions">
          <a id="explorer-link" target="_blank" rel="noopener">View transaction on Solana Explorer</a>
        </div>
        <button id="retry-save" class="secondary-button" type="button" hidden>
          Retry saving confirmed sale
        </button>
      </section>

      <p id="error" class="error" role="alert"></p>
    </main>
    <script type="module" src="/src/main.js"></script>
    <script>
      window.addEventListener("error", (event) => {
        const error = document.querySelector("#error");
        if (error) error.textContent = `Checkout failed to load: ${event.message || "JavaScript error"}`;
      });
      window.addEventListener("unhandledrejection", (event) => {
        const error = document.querySelector("#error");
        if (error) error.textContent = `Checkout failed: ${event.reason?.message || event.reason || "Unknown error"}`;
      });
    </script>
  </body>
</html>
