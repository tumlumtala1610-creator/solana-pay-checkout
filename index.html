<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bazaarly Solana Pay Checkout</title>
  </head>
  <body>
    <main class="checkout">
      <p class="eyebrow">BAZAARLY · SOLANA DEVNET</p>
      <h1>Confirm your checkout</h1>
      <p class="intro">Item prices come from Bazaarly inventory in USD. This demo requests a fixed 0.01 test SOL.</p>

      <form id="payment-form">
        <label>
          Bazaarly event ID
          <input id="event-id" autocomplete="off" required />
        </label>
        <section class="cart-editor" aria-label="Bazaarly inventory items">
          <h2>Items</h2>
          <div id="items-container"></div>
          <button id="add-item" class="secondary-button" type="button">Add item ID</button>
          <p class="cart-total">Revenue total (USD): <strong id="cart-total">$0.00</strong></p>
        </section>
        <p id="checkout-context" class="ledger-note"></p>
        <button id="pay-button" type="submit">Create Solana Pay QR</button>
      </form>

      <section id="payment-panel" hidden>
        <div id="qr-code" aria-label="Solana Pay QR code"></div>
        <p id="status" class="status">Waiting for payment…</p>
      </section>

      <section id="result-panel" hidden>
        <h2>Payment receipt</h2>
        <dl id="receipt-details" class="details"></dl>
        <p id="accounting-entry" class="accounting-entry"></p>
        <div class="actions">
          <a id="explorer-link" target="_blank" rel="noopener">View transaction on Solana Explorer</a>
        </div>
        <button id="retry-save" class="secondary-button" type="button" hidden>
          Retry saving confirmed sale
        </button>
      </section>

      <p id="error" class="error" role="alert"></p>
    </main>
    <script type="module" src="/src/main.js"></script>
    <script>
      window.addEventListener("error", (event) => {
        const error = document.querySelector("#error");
        if (error) error.textContent = `Checkout failed to load: ${event.message || "JavaScript error"}`;
      });
      window.addEventListener("unhandledrejection", (event) => {
        const error = document.querySelector("#error");
        if (error) error.textContent = `Checkout failed: ${event.reason?.message || event.reason || "Unknown error"}`;
      });
    </script>
  </body>
</html>
